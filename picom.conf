#######################################################################
#                      picom compositor (v13)                         #
#######################################################################

# ---- Backend ----
backend = "glx";
vsync = true;
use-damage = true;

# ---- Blur ----
blur: {
  method = "dual_kawase";
  strength = 4;
}

# ---- Fading ----
# Off: window open/close/resize is handled by the animations block below.
fading = false;

# ---- Detection / focus ----
# (mark-wmwin-focused / mark-ovredir-focused removed: they are old-style rule
#  options that conflict with the `rules` block below and v13 warns about them.)
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
detect-client-leader = true;
unredir-if-possible = true;

# ---- Per-window rules (v11+ unified syntax; replaces opacity-rule + wintypes) ----
rules = ({
    # 90% opacity for the terminals, launcher, notifier and conky
    match = "class_g = 'kitty'     || "
            "class_g = 'Alacritty' || "
            "class_g = 'Rofi'      || "
            "class_g = 'dunst'     || "
            "class_g = 'Conky'";
    opacity = 0.90;
}, {
    # Blur only normal windows (not splashes/tooltips/docks)
    match = "window_type = 'normal'";
    blur-background = true;
});

# ---- Animations (v11+ presets) ----
animations = ({
    triggers = [ "open", "show" ];
    preset = "appear";
}, {
    triggers = [ "close", "hide" ];
    preset = "disappear";
}, {
    triggers = [ "geometry" ];
    preset = "geometry-change";
});
