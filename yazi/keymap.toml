# Yazi Keymap Configuration - Complete & Organized
# Full working configuration with all custom keybindings
# Place this file at ~/.config/yazi/keymap.toml

[mgr]

keymap = [
  # ============ NAVIGATION ============
  { on = "j", run = "arrow 1 --no-wrap", desc = "Move down (no wrap)" },
  { on = "k", run = "arrow -1 --no-wrap", desc = "Move up (no wrap)" },
  { on = ["a", "p"], run = "shell --block -- mpv --no-video %h", desc = "Play as audio only" },
  { on = "l", run = "plugin smart-enter", desc = "Open file or enter directory" },
  { on = "h", run = "leave", desc = "Go back to parent directory" },
  { on = "<Up>", run = "arrow -1", desc = "Move cursor up" },
  { on = "<Down>", run = "arrow 1", desc = "Move cursor down" },

  # ============ PAGINATION ============
  { on = "<C-u>", run = "arrow -50%", desc = "Move cursor up half page" },
  { on = "<C-d>", run = "arrow 50%", desc = "Move cursor down half page" },
  { on = "<C-b>", run = "arrow -100%", desc = "Move cursor up one page" },
  { on = "<C-f>", run = "arrow 100%", desc = "Move cursor down one page" },
  { on = "<S-PageUp>", run = "arrow -50%", desc = "Move cursor up half page" },
  { on = "<S-PageDown>", run = "arrow 50%", desc = "Move cursor down half page" },
  { on = "<PageUp>", run = "arrow -100%", desc = "Move cursor up one page" },
  { on = "<PageDown>", run = "arrow 100%", desc = "Move cursor down one page" },

  # ============ BASIC CONTROLS ============
  { on = "q", run = "quit", desc = "Quit the process" },
  { on = "Q", run = "quit --no-cwd-file", desc = "Quit without cwd-file" },
  { on = "<C-c>", run = "close", desc = "Close current tab or quit" },
  { on = "<C-z>", run = "suspend", desc = "Suspend the process" },
  { on = ".", run = "hidden toggle", desc = "Toggle hidden files visibility" },

  # ============ SELECTION OPERATIONS ============
  { on = "<Space>", run = ["toggle", "arrow 1"], desc = "Toggle selection and move down" },
  { on = "u", run = ["unyank", "escape --select"], desc = "Unyank and clear all selections" },

  # ============ BUILT-IN COPY/PASTE ============
  { on = ["y", "y"], run = "yank", desc = "Yank (copy) selected files" },
  { on = ["d", "d"], run = "yank --cut", desc = "Yank (cut) selected files" },
  { on = "p", run = ["paste", "unyank"], desc = "Paste and deselect" },
  { on = "P", run = ["paste --force", "unyank"], desc = "Paste (overwrite) and deselect" },

  # ============ BUILT-IN COPY PATH ============
  { on = ["y", "p"], run = "copy path", desc = "Copy file path" },
  { on = ["y", "d"], run = "copy dirpath", desc = "Copy directory path" },
  { on = ["y", "n"], run = "copy filename", desc = "Copy filename" },
  { on = ["y", "."], run = "copy name_without_ext", desc = "Copy filename without extension" },


  # ============ SEARCH / FIND ============
  { on = "/", run = "find", desc = "Find file (forward)" },
  { on = "?", run = "find --previous", desc = "Find file (backward)" },
  { on = "n", run = "find_arrow", desc = "Find next match" },
  { on = "N", run = "find_arrow --previous", desc = "Find previous match" },
  { on = ["z", "g"], run = "search --via=rg", desc = "Search file contents (ripgrep)" },
  { on = ["z", "f"], run = "search --via=fd", desc = "Search filenames (fd)" },

  # ============ BUILT-IN DELETE ============
  { on = ["d", "t"], run = "remove", desc = "Trash selected files" },
  { on = ["d", "D"], run = "remove --permanently", desc = "Delete permanently" },
  { on = "<Delete>", run = "remove", desc = "Trash selected files" },

  # ============ BUILT-IN CREATE ============
  { on = ["m", "d"], run = "create --dir", desc = "Create directory" },
  { on = ["m", "f"], run = "create", desc = "Create file" },

  # ============ BUILT-IN RENAME ============
  { on = ["r", "a"], run = "rename --cursor=start", desc = "Rename (cursor at start)" },
  { on = ["r", "c"], run = "rename --cursor=before_ext", desc = "Rename (cursor before extension)" },
  { on = ["r", "e"], run = "rename --empty=ext --cursor=end", desc = "Rename extension only" },

  # ============ BUILT-IN SORT ============ 
  # yazi has no atime/ctime sort (unlike lf/ranger); btime (creation) is the
  # only extra time dimension it supports, so the old a/c binds are consolidated here.
  { on = ["s", "b"], run = "sort btime --reverse", desc = "Sort by creation time (newest first)" },
  { on = ["s", "e"], run = "sort extension --reverse", desc = "Sort by extension (reverse)" },
  { on = ["s", "n"], run = "sort natural --reverse", desc = "Sort by name naturally (reverse)" },
  { on = ["s", "s"], run = "sort size --reverse", desc = "Sort by size (largest first)" },
  { on = ["s", "t"], run = "sort mtime --reverse", desc = "Sort by modification time (newest first)" },

  # `show-info` is not a yazi command; 0.4+ uses `spot` for the file-info popup.
  { on = ["z", "i"], run = "spot", desc = "Show file info (spot popup)" },
]

prepend_keymap = [
  # ============ SHELL INTERACTIVE COMMANDS ============
  { on = ";", run = "shell --interactive", desc = "Run a shell command" },
  { on = ":", run = "shell --block --interactive", desc = "Run shell command (block until finishes)" },
  { on = "w", run = "quit", desc = "Quit and CD into current directory" },

  { on = ["e", "e"], run = "shell --block -- nvim %h", desc = "Edit file with Neovim" },
  { on = ["e", "i"], run = "shell --block -- exiftool %h | less", desc = "Show EXIF metadata" },
  { on = ["e", "g"], run = 'shell -- f=%h; magick %s "${f%.*}.pdf"', desc = "Convert image(s) to PDF (merges all selected into one)" },
  { on = ["e", "p"], run = "shell -- nsxiv -t ./* &> /dev/null &", desc = "Preview images in directory" },
  { on = ["e", "P"], run = "shell -- nsxiv %h &> /dev/null &", desc = "Open image with nsxiv" },

  # ============ ARCHIVE OPERATIONS ============
  { on = ["a", "z"], run = 'shell -- pack() { f=""; for p in "$@"; do f="$p"; done; out="$f.zip"; i=1; while [ -e "$out" ]; do out="$f-$i.zip"; i=$((i+1)); done; d=$(dirname "$1"); cd "$d" || return 1; names=(); for p in "$@"; do names+=("$(basename "$p")"); done; zip -r "$out" "${names[@]}"; }; pack %s', desc = "Create ZIP archive (named after last selected, all selected packed; folders keep their own structure, no leading path)" },
  { on = ["a", "t"], run = 'shell -- pack() { f=""; for p in "$@"; do f="$p"; done; out="$f.tar"; i=1; while [ -e "$out" ]; do out="$f-$i.tar"; i=$((i+1)); done; d=$(dirname "$1"); cd "$d" || return 1; names=(); for p in "$@"; do names+=("$(basename "$p")"); done; tar -cvf "$out" "${names[@]}"; }; pack %s', desc = "Create TAR archive (named after last selected, all selected packed; folders keep their own structure, no leading path)" },
  { on = ["a", "g"], run = 'shell -- pack() { f=""; for p in "$@"; do f="$p"; done; out="$f.tar.gz"; i=1; while [ -e "$out" ]; do out="$f-$i.tar.gz"; i=$((i+1)); done; d=$(dirname "$1"); cd "$d" || return 1; names=(); for p in "$@"; do names+=("$(basename "$p")"); done; tar -cvzf "$out" "${names[@]}"; }; pack %s', desc = "Create TAR.GZ archive (named after last selected, all selected packed; folders keep their own structure, no leading path)" },
  { on = ["a", "b"], run = 'shell -- pack() { f=""; for p in "$@"; do f="$p"; done; out="$f.tar.bz2"; i=1; while [ -e "$out" ]; do out="$f-$i.tar.bz2"; i=$((i+1)); done; d=$(dirname "$1"); cd "$d" || return 1; names=(); for p in "$@"; do names+=("$(basename "$p")"); done; tar -cjvf "$out" "${names[@]}"; }; pack %s', desc = "Create TAR.BZ2 archive (named after last selected, all selected packed; folders keep their own structure, no leading path)" },
  { on = ["a", "u"], run = "shell -- smart-extract.sh %s", desc = "Extract archive(s) - smart: no wrapper folder if already single-rooted, auto-renames on collision" },

  # ============ TRASH MANAGEMENT ============
  { on = ["t", "r"], run = "shell --block -- trash-restore", desc = "Restore file from trash" },
  { on = ["t", "c"], run = "shell --block -- trash-empty", desc = "Clear entire trash" },
  { on = ["t", "g"], run = "cd $HOME/.local/share/Trash/", desc = "Go to trash directory" },

  # ============ WALLPAPER ============
  { on = ["b", "g"], run = "shell -- $HOME/.config/yazi/set-wallpaper.sh %h", desc = "Set hovered image as wallpaper" },

  # ============ PERMISSIONS ============
  { on = ["c", "k", "e"], run = "shell --block -- chmod +x %s", desc = "Make selected file(s) executable" },
  { on = ["c", "k", "u"], run = "shell --block -- chmod -x %s", desc = "Make selected file(s) non-executable" },
]
