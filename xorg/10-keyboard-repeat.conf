# X resets a keyboard to its built-in 660/25 repeat rate every time the device
# is re-added, and a udev "change" trigger (systemd's pacman hook runs one after
# any package touches udev rules) re-adds every keyboard. Setting the rate here
# makes X apply it on each re-add, instead of an `xset` that only covers the
# devices present at login.
#
# Unlike `xset r rate`, the second value is the gap between repeats in ms, not
# repeats per second: "300 20" here is `xset r rate 300 50`.
Section "InputClass"
    Identifier "keyboard-repeat-rate"
    MatchIsKeyboard "on"
    Option "AutoRepeat" "300 20"
EndSection
