[bar]
fill = 
empty = 
indicator = 

[module/volume]
; Rewritten from internal/pulseaudio to custom/script: that module type has
; no scroll-up/scroll-down hook at all, so there was no way to trigger the
; volume OSD (bash_scripts/volume-osd.sh) from the bar itself.
type = custom/script
; tail: the script stays running and prints a new line on each pulseaudio
; event instead of being re-executed on a fixed interval -- this is what
; actually mirrors how internal/pulseaudio reacted instantly to changes.
exec = $HOME/bin/bash_scripts/system/polybar-volume-status.sh
tail = true

click-left = $HOME/bin/bash_scripts/system/volume-osd.sh mute
click-right = bash $HOME/.config/rofi/bin/applet_volume &
scroll-up = $HOME/bin/bash_scripts/system/volume-osd.sh up
scroll-down = $HOME/bin/bash_scripts/system/volume-osd.sh down

[module/cpu_bar]
type = internal/cpu

interval = 0.5

format = <label>
format-prefix = " "
format-prefix-foreground = ${color.red}

label = CPU %percentage%%


[module/filesystem_bar]
type = internal/fs

mount-0 = /

interval = 30

fixed-values = false


format-mounted = <label-mounted>
format-mounted-prefix = " "
format-mounted-prefix-foreground = ${color.yellow}

label-mounted = %used%/%total%

[module/memory_bar]
type = internal/memory

interval = 2

format =  <label>
format-prefix = " "
format-prefix-foreground = ${color.purple}

label = "%gb_used%/%gb_total%"

[module/bspwm]
type = internal/bspwm

pin-workspaces = true
inline-mode = false

enable-click = true
enable-scroll = true
reverse-scroll = true

fuzzy-match = true

format = <label-state>
label-monitor = %name%

label-focused = %name%
label-focused-foreground = ${color.background}
label-focused-background = ${color.blue}
label-focused-padding = 1

label-occupied = %name%
label-occupied-foreground = ${color.purple}
label-occupied-padding = 1

label-urgent = %name%
label-urgent-foreground = ${color.red}
label-urgent-padding = 1

label-empty = %name%
label-empty-foreground = ${color.foreground}
label-empty-padding = 1

label-separator = " "
label-separator-padding = 0


[module/mod]
type = internal/bspwm

format = <label-mode>
format-background = ${color.yellow}
format-foreground = ${color.background}
format-padding = 1

label-monocle = "Monocle"
label-tiled = "Tiled"

label-floating = ", Float"
label-pseudotiled = ", Pseudo"
label-fullscreen = ", Full"

label-locked = " Locked"
label-sticky = " Sticky"
label-private = " Private"

[module/date]
type = internal/date

interval = 1.0

time = %I:%M %p
time-alt = %A, %d %B %Y

format = <label>
format-prefix = " "
format-prefix-foreground = ${color.red}

label = %time%

