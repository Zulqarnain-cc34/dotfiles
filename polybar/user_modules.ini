[module/uptime]
;https://github.com/jaagr/polybar/wiki/User-contributed-modules#uptime
type = custom/script
exec = uptime | awk -F, '{sub(".*up ",x,$1);print $1}'
interval = 100
label = %output%

format-prefix = " "
format-prefix-foreground = ${color.teal}
format-underline =

[module/launcher]
type = custom/text
format = 

format-background = ${color.blue}
format-foreground = ${color.background}
format-padding = 1

click-left = bash $HOME/.config/rofi/launchers/ribbon/launcher.sh &
click-right = rofi-bangs &

[module/powermenu]
type = custom/menu
expand-right = true

format-spacing = 1

label-open = "  " 
label-open-foreground = ${color.background}
label-open-background =  ${color.red}

# 取 と take, fetch, take up 
# 销 け Erase, Cancel
# 取消 torikeshi (とりけし) cancellation; withdrawal; abolition; revocation; cancel;
label-close = "  取消"
label-close-foreground = ${color.red}
label-separator = |
label-separator-foreground = ${color.foreground-alt}

menu-0-0 = 閉鎖
menu-0-0-exec = poweroff

menu-0-1 = 再起動
menu-0-1-exec = reboot

menu-0-2 = 消
menu-0-2-exec = pkill -kill -u $USER

[module/networkspeedup]
;https://github.com/jaagr/polybar/wiki/Module:-network
type = internal/network
; HARDWARE-SPECIFIC: Network interface name (same as in [module/network])
;interface = wlp3s0
;interface = enp14s0
;interface = enp0s31f6
;interface = enp38s0
interface-type = wireless
label-connected = "%upspeed:7%"
format-connected = <label-connected>
format-connected-prefix = "🔺"
format-connected-prefix-foreground = ${color.cyan}
;; _-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_

[module/networkspeeddown]
;https://github.com/jaagr/polybar/wiki/Module:-network
type = internal/network
; HARDWARE-SPECIFIC: Network interface name (same as in [module/network])
;interface = wlp3s0
;interface = enp14s0
;interface = enp0s31f6
;interface = enp38s0
interface-type = wireless
label-connected = "%downspeed:7%"
format-connected = <label-connected>
format-connected-prefix = "🔻"
format-connected-prefix-foreground = ${color.cyan}

