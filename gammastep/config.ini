; Matches redshift/redshift.conf — edit lat/lon in both files together
[general]
temp-day=3000
temp-night=3000
gamma=0.8:0.7:0.8
fade=1
brightness-day=1.0
brightness-night=1.0
location-provider=manual
; wayland fails on some niri setups ("Zero outputs support gamma adjustment")
adjustment-method=drm

[manual]
lat=33.6844
lon=73.0479

[drm]
card=1

[wayland]
output=eDP-*
